<!DOCTYPE html>
<html>
<head>
    <title>Grid Areas Layout</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif;">

    <div style="
        display: grid;
        grid-template-columns: 200px 1fr;
        grid-template-rows: 80px 1fr 70px;
        grid-template-areas:
            'header header'
            'sidebar main'
            'footer footer';
        min-height: 100vh;
        gap: 10px;
    ">

        <!-- Header -->
        <header style="
            grid-area: header;
            background-color: #222;
            color: white;
            padding: 20px;
        ">
            <h1 style="margin: 0;">NYB Infotech</h1>
        </header>

        <!-- Sidebar -->
        <aside style="
            grid-area: sidebar;
            background-color: #f2f2f2;
            padding: 20px;
        ">
            <h2>Sidebar</h2>
            <p>Home</p>
            <p>Services</p>
            <p>Projects</p>
            <p>Contact</p>
        </aside>

        <!-- Main Content -->
        <main style="
            grid-area: main;
            background-color: #e8f0fe;
            padding: 20px;
        ">
            <h2>Welcome to NYB Infotech</h2>
            <p>We provide web development and software solutions.</p>
        </main>

        <!-- Footer -->
        <footer style="
            grid-area: footer;
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
        ">
            <p style="margin: 0;">© 2026 NYB Infotech</p>
        </footer>

    </div>

</body>
</html>




<!-- 

Feature	Flexbox	Grid
Layout type	One-dimensional	Two-dimensional
Works with	Row or column	Rows and columns
Best for	Small components	Complete page layouts
Alignment	Excellent for alignment	Excellent for structured layouts
Common use	Navigation bars, buttons, cards	Web pages, galleries, dashboards
Main properties	flex-direction, justify-content, align-items	grid-template-columns, grid-template-rows, grid-template-areas -->
