<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout</title>
</head>
<body style="margin: 0; font-family: Arial, sans-serif;">

    <!-- Header Layout -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #222; color: white;">
        <h1 style="margin: 0;">NYB Infotech</h1>

        <!-- Navigation Layout -->
        <nav style="display: flex; gap: 20px;">
            <a href="#" style="color: white; text-decoration: none;">Home</a>
            <a href="#" style="color: white; text-decoration: none;">About</a>
            <a href="#" style="color: white; text-decoration: none;">Services</a>
            <a href="#" style="color: white; text-decoration: none;">Contact</a>
        </nav>
    </header>

    <!-- Card Flexbox Layout -->
    <main style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 40px;">

        <div style="flex: 1; min-width: 200px; padding: 30px; text-align: center; background: #f2f2f2; border-radius: 10px;">
            <h2>Web Development</h2>
            <p>Building modern websites.</p>
        </div>

        <div style="flex: 1; min-width: 200px; padding: 30px; text-align: center; background: #f2f2f2; border-radius: 10px;">
            <h2>JavaScript</h2>
            <p>Creating interactive applications.</p>
        </div>

        <div style="flex: 1; min-width: 200px; padding: 30px; text-align: center; background: #f2f2f2; border-radius: 10px;">
            <h2>CSS</h2>
            <p>Designing responsive layouts.</p>
        </div>

    </main>

    <!-- Footer Layout -->
    <footer style="display: flex; justify-content: space-around; align-items: center; padding: 20px; background: #222; color: white;">
        <p>© 2026 NYB Infotech</p>
        <p>All Rights Reserved</p>
    </footer>

</body>
</html>
