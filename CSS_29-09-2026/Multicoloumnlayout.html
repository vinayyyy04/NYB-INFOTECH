<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Multi-Column Layout</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif;">

    <h1 style="text-align: center; margin: 30px;">
        NYB Infotech
    </h1>

    <!-- Multi-Column Grid Layout -->
    <div style="
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        padding: 30px;
    ">

        <div style="
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>Web Development</h2>
            <p>Build modern websites.</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>JavaScript</h2>
            <p>Create interactive applications.</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>CSS</h2>
            <p>Design responsive websites.</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>React</h2>
            <p>Build user interfaces.</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>Node.js</h2>
            <p>Develop backend applications.</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #f2f2f2;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>Database</h2>
            <p>Manage application data.</p>
        </div>

    </div>

</body>
</html>
