<!DOCTYPE html>
<html>
<head>
    <title>CSS Grid Functions</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif;">

    <h1 style="text-align: center;">NYB Infotech</h1>

    <div style="
        display: grid;
        grid-template-columns: repeat(3, minmax(200px, 1fr));
        gap: 20px;
        padding: 30px;
    ">

        <div style="
            padding: 30px;
            background-color: #e8f0fe;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>HTML</h2>
            <p>Structure of webpages</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #e8f0fe;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>CSS</h2>
            <p>Styling of webpages</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #e8f0fe;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>JavaScript</h2>
            <p>Interactive webpages</p>
        </div>

        <div style="
            padding: 30px;
            background-color: #e8f0fe;
            text-align: center;
            border-radius: 10px;
        ">
            <h2>React</h2>
            <p>User interface development</p>
        </div>

    </div>

</body>
</html>
