<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Card Layout</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif;">

    <h1 style="text-align: center; margin: 30px;">
        NYB Infotech Services
    </h1>

    <!-- Card Container -->
    <div style="
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
        padding: 20px;
    ">

        <!-- Card 1 -->
        <div style="
            flex: 1;
            min-width: 220px;
            max-width: 300px;
            padding: 25px;
            text-align: center;
            background-color: #f2f2f2;
            border-radius: 10px;
        ">
            <h2>Web Development</h2>
            <p>Learn to build modern and responsive websites.</p>
            <button style="padding: 10px 20px;">Learn More</button>
        </div>

        <!-- Card 2 -->
        <div style="

            min-width: 220px;

        ">
            <h2>JavaScript</h2>
            <p>Learn JavaScript for interactive web applications.</p>
            <button style="padding: 10px 20px;">Learn More</button>
        </div>

        <!-- Card 3 -->
        <div style="
            flex: 1;
            min-width: 220px;

</body>
</html>
