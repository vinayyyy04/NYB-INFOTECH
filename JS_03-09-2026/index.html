<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f4f6;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .form-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-section h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .section-title {
            margin-bottom: 20px;
        }

        .cars-container {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 20px;
        }

        .car-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .car-icon {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .car-card h3 {
            margin-bottom: 10px;
        }

        .car-card p {
            margin: 7px 0;
            color: #6b7280;
        }

        .loading {
            text-align: center;
            margin: 20px;
            color: #6b7280;
        }

        .error {
            color: #dc2626;
            text-align: center;
            margin: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>🚗 Car Management System</h1>
        <p>Manage cars using JavaScript APIs</p>
    </header>


    <div class="container">

        <!-- ADD CAR -->
        <section class="form-section">

            <h2>➕ Add New Car</h2>

            <div class="form-group">
                <label for="brand">Car Brand</label>

                <input
                    type="text"
                    id="brand"
                    placeholder="Enter car brand"
                >
            </div>


            <div class="form-group">
                <label for="model">Car Model</label>

                <input
                    type="text"
                    id="model"
                    placeholder="Enter car model"
                >
            </div>


            <div class="form-group">
                <label for="year">Manufacturing Year</label>

                <input
                    type="number"
                    id="year"
                    placeholder="Enter year"
                >
            </div>


            <div class="form-group">
                <label for="type">Car Type</label>

                <select id="type">

                    <option value="">
                        Select car type
                    </option>

                    <option value="SUV">
                        SUV
                    </option>

                    <option value="Sedan">
                        Sedan
                    </option>

                    <option value="Hatchback">
                        Hatchback
                    </option>

                    <option value="Sports">
                        Sports
                    </option>

                </select>
            </div>


            <button onclick="addCar()">
                Add Car
            </button>


            <p id="message"></p>

        </section>


        <!-- CAR LIST -->
        <section>

            <h2 class="section-title">
                🚘 Available Cars
            </h2>

            <p id="loading" class="loading">
                Loading cars...
            </p>

            <div
                id="carsContainer"
                class="cars-container">
            </div>

        </section>

    </div>


    <script>

// Get request

        async function getCars() {

            try {

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/posts"
                );


    // Check HTTP status

                if (!response.ok) {

                    throw new Error(
                        `HTTP Error: ${response.status}`
                    );

                }


                const data = await response.json();


                // Use first 6 records as car data

                const cars = data.slice(0, 6);


                displayCars(cars);


            } catch (error) {

                console.error(
                    "GET Request Error:",
                    error.message
                );


                document.getElementById(
                    "loading"
                ).textContent =
                    "Unable to load cars.";

            }

        }

//Display cars

        function displayCars(cars) {

            const container =
                document.getElementById(
                    "carsContainer"
                );


            document.getElementById(
                "loading"
            ).style.display = "none";


            container.innerHTML = "";


            cars.forEach((car, index) => {

                const card =
                    document.createElement("div");


                card.className = "car-card";


                card.innerHTML = `

                    <div class="car-icon">
                        🚗
                    </div>

                    <h3>
                        Car ${index + 1}
                    </h3>

                    <p>
                        <strong>Brand:</strong>
                        ${car.title.substring(0, 15)}
                    </p>

                    <p>
                        <strong>Model:</strong>
                        Model ${car.id}
                    </p>

                    <p>
                        <strong>Year:</strong>
                        ${2020 + index}
                    </p>

                    <p>
                        <strong>Type:</strong>
                        ${index % 2 === 0
                            ? "SUV"
                            : "Sedan"}
                    </p>

                `;


                container.appendChild(card);

            });

        }


   //Post request

        async function addCar() {

            const brand =
                document.getElementById(
                    "brand"
                ).value.trim();


            const model =
                document.getElementById(
                    "model"
                ).value.trim();


            const year =
                document.getElementById(
                    "year"
                ).value;


            const type =
                document.getElementById(
                    "type"
                ).value;


            const message =
                document.getElementById(
                    "message"
                );


//validation
            if (
                !brand ||
                !model ||
                !year ||
                !type
            ) {

                message.textContent =
                    "Please fill in all fields.";

                message.style.color =
                    "#dc2626";

                return;

            }


//Car object
            const newCar = {

                brand: brand,

                model: model,

                year: Number(year),

                type: type

            };


            try {
//Post request

                const response = await fetch(

                    "https://jsonplaceholder.typicode.com/posts",

                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(newCar)

                    }

                );


   //Error check

                if (!response.ok) {

                    throw new Error(
                        `HTTP Error: ${response.status}`
                    );

                }


                // Convert response to JSON

                const createdCar =
                    await response.json();


                console.log(
                    "Created Car:",
                    createdCar
                );


 //sucess message
                message.textContent =
                    `${brand} ${model} added successfully!`;

                message.style.color =
                    "#16a34a";


                // Clear form

                document.getElementById(
                    "brand"
                ).value = "";


                document.getElementById(
                    "model"
                ).value = "";


                document.getElementById(
                    "year"
                ).value = "";


                document.getElementById(
                    "type"
                ).value = "";


            } catch (error) {

                console.error(
                    "POST Request Error:",
                    error.message
                );


                message.textContent =
                    "Failed to add the car.";

                message.style.color =
                    "#dc2626";

            }

        }

// PROMISE + .then() + .catch()


        fetch(
            "https://jsonplaceholder.typicode.com/posts/1"
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "Failed to fetch car information"
                );

            }

            return response.json();

        })

        .then(data => {

            console.log(
                "Promise Example:",
                data
            );

        })

        .catch(error => {

            console.error(
                "Promise Error:",
                error.message
            );

        });

//loading of cars 

        getCars();

    </script>

</body>

</html>
