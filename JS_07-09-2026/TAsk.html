<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Bill</title>

    <link rel="stylesheet" href="Task.css">
</head>

<body>

    <div class="bill-container">

        <h1>🛒 Shopping Bill</h1>

        <div class="bill-row">
            <span>Customer</span>
            <strong id="customer"></strong>
        </div>

        <div class="bill-row">
            <span>Product</span>
            <strong id="product"></strong>
        </div>

        <div class="bill-row">
            <span>Price</span>
            <strong id="price"></strong>
        </div>

        <div class="bill-row">
            <span>Quantity</span>
            <strong id="quantity"></strong>
        </div>

        <div class="bill-row">
            <span>Subtotal</span>
            <strong id="subtotal"></strong>
        </div>

        <div class="bill-row">
            <span>Discount</span>
            <strong id="discount"></strong>
        </div>

        <div class="total">
            <span>Final Amount</span>
            <strong id="finalAmount"></strong>
        </div>

        <p class="thank-you">
            Thank you for shopping! 😊
        </p>

    </div>

    <script src="Task.js"></script>

</body>
</html>
