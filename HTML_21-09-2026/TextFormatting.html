<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Formatting Practice</title>
</head>

<body>

    <h1>HTML Text Formatting</h1>

    <p>
        <b>This is bold text.</b>
    </p>

    <p>
        <i>This is italic text.</i>
    </p>

    <p>
        <u>This is underlined text.</u>
    </p>

    <p>
        <strong>This text has strong importance.</strong>
    </p>

    <p>
        <em>This text is emphasized.</em>
    </p>

    <p>
        <mark>This text is highlighted.</mark>
    </p>

    <p>
        H<sub>2</sub>O
    </p>

    <p>
        X<sup>2</sup>
    </p>

    <p>
        First Line<br>
        Second Line
    </p>

    <hr>

    <p>
        Normal text with
        <b>bold</b>,
        <i>italic</i>,
        <u>underline</u>,
        <strong>strong</strong>,
        <em>emphasis</em>,
        and <mark>highlighted</mark> text.
    </p>

</body>

</html>






<!-- Block-Level vs Inline Elements

The main difference is how they occupy space and behave in a webpage.

Feature	Block-Level Elements	Inline Elements
Definition	Start on a new line and form a separate block	Stay within the same line
Width	Usually take the available width	Take only the space needed by content
New Line	Normally starts on a new line	Normally does not start a new line
Can contain	Can generally contain other elements, depending on HTML rules	Usually contain text or other inline content
Common examples	<div>, <p>, <h1>, <section>, <article>, <header>, <footer> -->
