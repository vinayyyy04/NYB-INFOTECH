<!DOCTYPE html>
<html>
<head>
    <title>Car Showroom</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #f2f2f2;
            padding: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            max-width: 400px;
            margin: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            padding: 10px 18px;
            margin: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🚗 Car Showroom</h2>

        <button onclick="saveCar()">Save Favorite Car</button>
        <button onclick="showCar()">Show Favorite Car</button>
        <button onclick="clearCar()">Clear Car</button>

        <p id="output"></p>
    </div>

    <script src="BOM.js"></script>
</body>
</html>
