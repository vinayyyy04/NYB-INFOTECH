<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic HTML5</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Website</h1>

        <!-- Navigation -->
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- Main Content -->
    <main>

        <!-- Section -->
        <section id="home">
            <h2>Welcome</h2>
            <p>Welcome to my website.</p>
        </section>

        <!-- Article -->
        <article>
            <h2>Latest Article</h2>
            <p>This is an independent article.</p>

            <!-- Figure -->
            <figure>
                <img src="image.jpg" alt="Website illustration">
                <figcaption>Website Illustration</figcaption>
            </figure>
        </article>

        <!-- Aside -->
        <aside>
            <h2>Related Information</h2>
            <p>Additional information is provided here.</p>
        </aside>

        <!-- Details -->
        <details>
            <summary>Read More</summary>
            <p>Additional hidden information can be displayed here.</p>
        </details>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
