<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transforms</title>

    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            min-height: 100vh;
        }

        .box {
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2563eb;
            color: white;
            font-weight: bold;
            border-radius: 10px;
            transition: transform 0.5s ease;
        }

        /* Scale */
        .scale:hover {
            transform: scale(1.2);
        }

        /* Rotate */
        .rotate:hover {
            transform: rotate(45deg);
        }

        /* Translate */
        .translate:hover {
            transform: translate(20px, -20px);
        }

        /* Skew */
        .skew:hover {
            transform: skew(15deg, 10deg);
        }

        /* Multiple transforms */
        .multiple:hover {
            transform: translateY(-15px) scale(1.1) rotate(5deg);
        }
    </style>
</head>

<body style="margin:0; font-family:Arial, sans-serif; background:#f1f5f9;">

    <h1 style="text-align:center; padding-top:30px;">
        NYB Infotech - CSS Transforms
    </h1>

    <div class="container">

        <div class="box scale">
            Scale
        </div>

        <div class="box rotate">
            Rotate
        </div>

        <div class="box translate">
            Translate
        </div>

        <div class="box skew">
            Skew
        </div>

        <div class="box multiple">
            Multiple
        </div>

    </div>

</body>
</html>
