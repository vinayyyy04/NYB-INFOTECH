<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover Effects with Transitions</title>

    <style>
        .card {
            width: 250px;
            padding: 25px;
            background: white;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;

            /* Transition */
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease,
                        background 0.3s ease;
        }

        /* Hover Effect */
        .card:hover {
            transform: translateY(-10px);
            background: #e0f2fe;
            box-shadow: 0 10px 20px #aaa;
        }

        .button {
            padding: 12px 25px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 5px;
            cursor: pointer;

            transition: background 0.3s ease,
                        transform 0.3s ease;
        }

        .button:hover {
            background: #1d4ed8;
            transform: scale(1.05);
        }
    </style>
</head>

<body style="
    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f5f9;
">

    <div style="
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        gap:30px;
        flex-wrap:wrap;
    ">

        <!-- Card -->
        <div class="card">
            <h2>NYB Infotech</h2>
            <p>Web Development</p>
            <button class="button">Learn More</button>
        </div>

    </div>

</body>
</html>
