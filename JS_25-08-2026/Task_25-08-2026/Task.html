<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile Manager</title>

  <link rel="stylesheet" href="Task.css" />
</head>

<body>

  <div class="container">
    <h1>Student Profile Manager</h1>
    <p>Modern JavaScript Object Features</p>

    <div class="card">

      <h2 id="studentName"></h2>

      <div class="details">
        <p><strong>Age:</strong> <span id="age"></span></p>
        <p><strong>Course:</strong> <span id="course"></span></p>
        <p><strong>City:</strong> <span id="city"></span></p>
        <p><strong>Phone:</strong> <span id="phone"></span></p>
      </div>

      <button id="showKeys">Show Keys</button>
      <button id="showValues">Show Values</button>
      <button id="showEntries">Show Entries</button>
      <button id="updateStudent">Update Student</button>

      <div id="output"></div>

    </div>
  </div>

  <script src="Task.js"></script>

</body>
</html>
