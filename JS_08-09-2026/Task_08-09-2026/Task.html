<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result Management</title>

    <link rel="stylesheet" href="Task.css">
</head>

<body>

    <div class="container">

        <header class="header">
            <h1>Student Result</h1>
            <p>Student Performance Management System</p>
        </header>


        <main class="card">

            <section class="student-info">

                <h2>Student Information</h2>

                <div class="info-grid">

                    <div class="info-box">
                        <span>Name</span>
                        <strong id="studentName">-</strong>
                    </div>

                    <div class="info-box">
                        <span>Age</span>
                        <strong id="studentAge">-</strong>
                    </div>

                    <div class="info-box">
                        <span>Attendance</span>
                        <strong id="attendance">-</strong>
                    </div>

                    <div class="info-box">
                        <span>Subjects</span>
                        <strong id="subjects">-</strong>
                    </div>

                </div>

            </section>


            <section class="result-section">

                <h2>Academic Result</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span>Total Marks</span>
                        <strong id="totalMarks">-</strong>
                    </div>

                    <div class="result-box">
                        <span>Average</span>
                        <strong id="average">-</strong>
                    </div>

                    <div class="result-box">
                        <span>Highest Mark</span>
                        <strong id="highestMark">-</strong>
                    </div>

                    <div class="result-box">
                        <span>Grade</span>
                        <strong id="grade">-</strong>
                    </div>

                </div>

            </section>


            <section class="status-section">

                <h2>Final Status</h2>

                <div class="status">

                    <div>
                        <span>Performance</span>
                        <strong id="performance">-</strong>
                    </div>

                    <div>
                        <span>Result</span>
                        <strong id="result">-</strong>
                    </div>

                    <div>
                        <span>Eligibility</span>
                        <strong id="eligibility">-</strong>
                    </div>

                </div>

            </section>


            <section class="marks-section">

                <h2>Subject Marks</h2>

                <div id="marksContainer" class="marks-container">
                    <!-- JavaScript will add marks here -->
                </div>

            </section>

        </main>


        <footer>
            <p>Student Result Management System</p>
        </footer>

    </div>


    <script src="Task.js"></script>

</body>
</html>
