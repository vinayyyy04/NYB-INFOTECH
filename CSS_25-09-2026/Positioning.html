<!DOCTYPE html>
<html>
<head>
    <title>CSS Positioning</title>

    <style>
        .container {
            position: relative;
            width: 500px;
            height: 400px;
            margin: 50px auto;
            padding: 20px;
            background-color: lightgray;
            border: 2px solid black;
        }

        /* Static */
        .static {
            position: static;
            background-color: lightblue;
            padding: 10px;
        }

        /* Relative */
        .relative {
            position: relative;
            left: 30px;
            top: 10px;
            background-color: lightgreen;
            padding: 10px;
        }

        /* Absolute */
        .absolute {
            position: absolute;
            right: 20px;
            top: 100px;
            background-color: lightcoral;
            padding: 10px;
        }

        /* Fixed */
        .fixed {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background-color: orange;
            padding: 15px;
        }

        /* Sticky */
        .sticky {
            position: sticky;
            top: 0;
            background-color: purple;
            color: white;
            padding: 10px;
        }
    </style>
</head>

<body>

    <div class="sticky">
        Sticky Element
    </div>

    <div class="container">

        <div class="static">
            Static Position
        </div>

        <div class="relative">
            Relative Position
        </div>

        <div class="absolute">
            Absolute Position
        </div>

    </div>

    <div class="fixed">
        Fixed Position
    </div>

</body>
</html>
