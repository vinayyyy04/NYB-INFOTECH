<!DOCTYPE html>
<html>
<head>
    <title>Responsive Desktop to Mobile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        /* Desktop Layout */
        header {
            background-color: #222;
            color: white;
            padding: 25px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 15px;
            background-color: #333;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .content {
            flex: 3;
            background-color: white;
            padding: 25px;
            border: 1px solid #ddd;
        }

        .sidebar {
            flex: 1;
            background-color: lightblue;
            padding: 25px;
            border: 1px solid #aaa;
        }

        /* Mobile Layout */
        @media (max-width: 600px) {

            nav {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .container {
                flex-direction: column;
                margin: 10px;
                padding: 10px;
            }

            .content,
            .sidebar {
                width: 100%;
            }

            header h1 {
                font-size: 24px;
            }

            .content,
            .sidebar {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Responsive Desktop to Mobile</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <div class="container">

        <main class="content">
            <h2>Main Content</h2>
            <p>
                This is the main content area of the website.
            </p>
        </main>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>
                This sidebar moves below the content on mobile.
            </p>
        </aside>

    </div>

</body>
</html>





<!-- | Feature           | Flexbox                         | CSS Grid                             |
| ----------------- | ------------------------------- | ------------------------------------ |
| Layout type       | **One-dimensional**             | **Two-dimensional**                  |
| Works with        | Row **or** column               | Rows **and** columns                 |
| Best for          | Components and small layouts    | Complete page layouts                |
| Alignment         | Excellent                       | Excellent                            |
| Responsive design | Yes                             | Yes                                  |
| Common use        | Navbar, buttons, cards in a row | Dashboard, gallery, webpage sections | -->
