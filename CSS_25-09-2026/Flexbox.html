<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Example</title>

    <style>
        .container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;

            padding: 30px;
            background-color: lightgray;
        }

        .box {
            flex: 1;
            min-width: 150px;
            padding: 30px;
            text-align: center;
            background-color: lightblue;
            border: 2px solid blue;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Flexbox Layout</h1>

    <div class="container">

        <div class="box">Box 1</div>

        <div class="box">Box 2</div>

        <div class="box">Box 3</div>

    </div>

</body>
</html>
