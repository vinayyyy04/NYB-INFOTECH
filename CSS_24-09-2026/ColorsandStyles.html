<!DOCTYPE html>
<html>
<head>
    <title>Colors and Backgrounds</title>

    <style>
        /* Text Color */
        h1 {
            color: blue;
        }

        /* Background Color */
        .box {
            background-color: lightyellow;
        }

        /* RGB Color */
        .rgb {
            color: rgb(255, 0, 0);
        }

        /* HEX Color */
        .hex {
            color: #008000;
        }

        /* Background Image */
        .banner {
            background-image: url("https://via.placeholder.com/800x200");
            background-size: cover;
            background-position: center;
            height: 200px;
        }

        /* Background Repeat */
        .repeat {
            background-image: url("https://via.placeholder.com/50");
            background-repeat: repeat;
            height: 100px;
        }

        /* Background Gradient */
        .gradient {
            background: linear-gradient(to right, blue, purple);
            color: white;
            padding: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Colors and Backgrounds</h1>

    <div class="box">
        Background Color
    </div>

    <p class="rgb">This uses RGB color.</p>

    <p class="hex">This uses HEX color.</p>

    <div class="banner">
        Background Image
    </div>

    <div class="repeat">
        Background Repeat
    </div>

    <div class="gradient">
        Gradient Background
    </div>

</body>
</html>
