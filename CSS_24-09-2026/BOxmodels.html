<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            /* Content */
            width: 300px;
            height: 100px;

            /* Padding */
            padding: 20px;

            /* Border */
            border: 5px solid blue;

            /* Margin */
            margin: 30px;

            background-color: lightyellow;
        }

        .box-sizing {
            box-sizing: border-box;
            width: 300px;
            height: 150px;
            padding: 20px;
            border: 5px solid green;
            margin: 30px;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>

    <div class="box">
        Content Area
    </div>

    <div class="box-sizing">
        Box Sizing: Border Box
    </div>

</body>
</html>





<!-- | Feature                 | Margin                                     | Padding                             |
| ----------------------- | ------------------------------------------ | ----------------------------------- |
| Meaning                 | Space **outside** the element              | Space **inside** the element        |
| Position                | Between elements                           | Between content and border          |
| Background              | Background does **not** extend into margin | Background **extends** into padding |
| Border                  | Outside the margin                         | Outside the padding                 |
| Can use negative value? | Yes                                        | No                                  |
| Main purpose            | Creates space between elements             | Creates space around content        | -->
