<!DOCTYPE html>
<html>
<head>
    <title>Borders and Spacing</title>

    <style>
        /* Basic Border */
        .box1 {
            border: 2px solid black;
            padding: 20px;
            margin: 20px;
        }

        /* Different Border Styles */
        .box2 {
            border: 3px dashed blue;
            padding: 15px;
            margin: 20px;
        }

        /* Rounded Border */
        .box3 {
            border: 3px solid green;
            border-radius: 15px;
            padding: 20px;
            margin: 20px;
        }

        /* Individual Borders */
        .box4 {
            border-top: 3px solid red;
            border-right: 3px dotted blue;
            border-bottom: 3px dashed green;
            border-left: 3px double purple;

            padding: 20px;
            margin: 20px;
        }

        /* Width and Height with Spacing */
        .box5 {
            width: 300px;
            height: 100px;
            border: 2px solid black;
            padding: 20px;
            margin: 30px;
        }
    </style>
</head>

<body>

    <h1>CSS Borders and Spacing</h1>

    <div class="box1">
        Solid Border
    </div>

    <div class="box2">
        Dashed Border
    </div>

    <div class="box3">
        Rounded Border
    </div>

    <div class="box4">
        Different Borders on Each Side
    </div>

    <div class="box5">
        Width, Height, Padding and Margin
    </div>

</body>
</html>
