<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="Task.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>👨‍💻 Employee Dashboard</h1>
            <p>JavaScript Functions & Scope Practice</p>
        </header>

        <div class="card">
            <h2 id="employeeName">Employee</h2>
            <p id="role">Role: Developer</p>

            <div class="stats">
                <div>
                    <span>Projects</span>
                    <strong id="projects">0</strong>
                </div>

                <div>
                    <span>Salary</span>
                    <strong id="salary">₹0</strong>
                </div>
            </div>

            <button id="btn">Show Employee Details</button>
        </div>

        <div class="card">
            <h2>📊 Skills</h2>
            <ul id="skills"></ul>
        </div>

    </div>

    <script src="Task.js"></script>
</body>
</html>
